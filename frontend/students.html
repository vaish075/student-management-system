<!DOCTYPE html>
<html>

<head>
    <title>Add Student</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <div class="page">

        <nav class="topnav">
            <a href="dashboard.html">&larr; Dashboard</a>
            <button id="logoutBtn" type="button">Log out</button>
        </nav>

        <h1>Student Profiles</h1>

        <form id="studentForm" class="profile-form">

            <input type="text" id="name" placeholder="Student Name" required>

            <input type="text" id="studentNumber" placeholder="Student ID / USN">

            <input type="email" id="email" placeholder="Email" required>

            <input type="text" id="phone" placeholder="Phone Number" required>

            <input type="text" id="course" placeholder="Course" required>

            <input type="number" id="age" placeholder="Age" required>

            <input type="date" id="dateOfBirth" title="Date of birth">

            <select id="gender">
                <option value="">Gender</option>
                <option>Female</option>
                <option>Male</option>
                <option>Other</option>
            </select>

            <input type="text" id="address" placeholder="Address">

            <input type="text" id="guardianName" placeholder="Parent / Guardian">

            <input type="text" id="guardianPhone" placeholder="Guardian Phone">

            <input type="date" id="admissionDate" title="Admission date">

            <select id="status">
                <option>Active</option>
                <option>Graduated</option>
                <option>Discontinued</option>
            </select>

            <button type="submit">Add Student</button>

        </form>

        <h2>Student List</h2>

        <div class="filter-bar">
            <input type="search" id="studentSearch" placeholder="Search by ID, name, email, or phone">
            <input type="text" id="courseFilter" placeholder="Filter by course">
            <select id="statusFilter">
                <option value="">All statuses</option>
                <option>Active</option>
                <option>Graduated</option>
                <option>Discontinued</option>
            </select>
            <button type="button" id="searchBtn">Search</button>
        </div>

        <table border="1" id="studentTable">

            <thead>

                <tr>

                    <th>ID</th>
                    <th>Student No.</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Phone</th>
                    <th>Course</th>
                    <th>Age</th>
                    <th>Status</th>
                    <th>Actions</th>

                </tr>

            </thead>

            <tbody id="studentTableBody">

            </tbody>

        </table>

    </div>

    <script src="../js/auth.js"></script>
    <script src="../js/students.js"></script>

</body>

</html>
