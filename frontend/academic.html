<!DOCTYPE html>
<html>
<head>
    <title>Attendance and Marks</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="page">
        <nav class="topnav">
            <a href="dashboard.html">&larr; Dashboard</a>
            <a href="students.html">Student Profiles</a>
            <button id="logoutBtn" type="button">Log out</button>
        </nav>

        <h1>Attendance and Marks</h1>

        <label for="studentSelect">Select student</label>
        <select id="studentSelect">
            <option value="">Choose a student</option>
        </select>

        <section class="academic-grid">
            <form id="attendanceForm" class="panel">
                <h2>Record Attendance</h2>
                <input type="date" id="attendanceDate" required>
                <select id="attendanceStatus" required>
                    <option value="">Attendance status</option>
                    <option>Present</option>
                    <option>Absent</option>
                    <option>Leave</option>
                    <option>OD</option>
                </select>
                <input type="text" id="attendanceNote" placeholder="Note (optional)">
                <button type="submit">Save Attendance</button>
            </form>

            <form id="marksForm" class="panel">
                <h2>Record Marks</h2>
                <input type="text" id="subject" placeholder="Subject" required>
                <input type="text" id="assessment" placeholder="Assessment (Internal, Lab...)" required>
                <input type="number" id="score" min="0" step="0.01" placeholder="Score" required>
                <input type="number" id="maxScore" min="1" step="0.01" value="100" placeholder="Maximum score" required>
                <input type="text" id="term" placeholder="Term / Semester" required>
                <button type="submit">Save Marks</button>
            </form>
        </section>

        <section>
            <h2>Attendance History</h2>
            <table>
                <thead><tr><th>Date</th><th>Status</th><th>Note</th></tr></thead>
                <tbody id="attendanceBody"></tbody>
            </table>
        </section>

        <section>
            <h2>Marks History</h2>
            <table>
                <thead><tr><th>Subject</th><th>Assessment</th><th>Score</th><th>Term</th></tr></thead>
                <tbody id="marksBody"></tbody>
            </table>
        </section>
    </div>

    <script src="../js/auth.js"></script>
    <script src="../js/academic.js"></script>
</body>
</html>
